<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Age — Real-Time Age Tracker</title>
    <meta
      name="description"
      content="Track the live age of people in real-time — years, months, weeks, days and seconds."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Michroma&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <header class="site-header">
      <div class="header-inner">
        <!-- Left: Settings + Logo -->
        <div class="header-left">
          <div class="settings-wrap" id="settingsWrap">
            <button
              class="btn-settings"
              id="btnSettings"
              aria-label="Settings"
              title="Settings"
            >
              <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                <path
                  d="M12 15a3 3 0 100-6 3 3 0 000 6z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <!-- Settings Popover -->
            <div
              class="settings-popover"
              id="settingsPopover"
              aria-hidden="true"
            >
              <div class="popover-arrow"></div>
              <div class="popover-content">
                <p class="popover-heading">Settings</p>

                <div class="setting-row">
                  <div class="setting-info">
                    <span class="setting-label">Enable Edit</span>
                    <span class="setting-desc"
                      >Show edit &amp; delete on cards</span
                    >
                  </div>
                  <label class="toggle" for="toggleEdit">
                    <input type="checkbox" id="toggleEdit" />
                    <span class="toggle-track"
                      ><span class="toggle-thumb"></span
                    ></span>
                  </label>
                </div>

                <div class="setting-row">
                  <div class="setting-info">
                    <span class="setting-label">Theme Color</span>
                    <span class="setting-desc">Primary accent color</span>
                  </div>
                  <label
                    class="color-swatch-label"
                    for="themeColorPicker"
                    title="Change theme color"
                  >
                    <span class="color-swatch" id="colorSwatch"></span>
                    <input type="color" id="themeColorPicker" value="#a855f7" />
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M12 7v5l3 3"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="logo-text">Live<span class="accent">age</span></span>
          </div>
        </div>

        <!-- Center: Global Ticker -->
        <div class="header-center">
          <div class="global-ticker">
            <span class="g-ticker-dot"></span>
            <span class="global-time" id="globalTime">--:--:--</span>
          </div>
        </div>

        <!-- Right: Add Button -->
        <div class="header-right">
          <button
            class="btn-add"
            id="btnAdd"
            title="Add Person"
            aria-label="Add Person"
          >
            <span class="btn-add-icon">+</span>
            <span class="btn-add-label">Add Person</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main" id="main">
      <div class="empty-state" id="emptyState">
        <div class="empty-pulse">
          <svg viewBox="0 0 80 80" fill="none">
            <circle
              cx="40"
              cy="40"
              r="36"
              stroke="currentColor"
              stroke-width="2"
              opacity="0.3"
            />
            <circle
              cx="40"
              cy="40"
              r="28"
              stroke="currentColor"
              stroke-width="1.5"
              opacity="0.5"
            />
            <circle cx="40" cy="40" r="4" fill="currentColor" />
            <path
              d="M40 20v20l14 8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1 class="empty-title">Track Ages in Real&#8209;Time</h1>
        <p class="empty-sub">
          Add a person to watch their age tick &mdash; live, down to the second.
        </p>
        <button class="btn-cta" id="btnCta">+ Add First Person</button>
      </div>

      <div class="cards-grid" id="cardsGrid"></div>
    </main>

    <!-- Modal -->
    <div
      class="modal-overlay"
      id="modalOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-box">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle">New Person</h2>
          <button class="btn-close" id="btnClose" aria-label="Close">
            &#x2715;
          </button>
        </div>
        <form class="modal-form" id="addForm" autocomplete="off" novalidate>
          <div class="field-group">
            <label class="field-label" for="inputName">Name</label>
            <input
              class="field-input"
              type="text"
              id="inputName"
              name="name"
              placeholder="e.g. Alice"
              required
              maxlength="40"
            />
          </div>
          <div class="field-group">
            <label class="field-label" for="inputDob">Date of Birth</label>
            <input
              class="field-input"
              type="date"
              id="inputDob"
              name="dob"
              required
            />
            <p class="date-preview" id="datePreview"></p>
          </div>
          <div class="field-group">
            <label class="field-label" for="inputTime">
              Birth Time <span class="field-optional">optional</span>
            </label>
            <input class="field-input" type="time" id="inputTime" name="birthTime" />
            <p class="time-hint">&#8635; Defaults to 00:00 &mdash; age ticks from this exact moment</p>
          </div>
          <p class="form-error" id="formError" aria-live="polite"></p>
          <button class="btn-submit" type="submit" id="btnSubmit">
            <span>Start Tracking</span>
            <svg viewBox="0 0 20 20" fill="none">
              <path
                d="M4 10h12M12 6l4 4-4 4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>
      </div>
    </div>

    <script src="age.js"></script>
  </body>
</html>
